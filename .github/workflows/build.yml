name: Build Terraviva Portal

on:
  push:
    branches: ["main", "terraviva-portal-v2"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
      - run: npm install
      - run: npm run build
